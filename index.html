            </div>
        </div>

        <!-- QUIZ VIEW -->
        <div id="quiz-view" class="hidden">
            <div class="flex justify-between items-center mb-3">
                <span id="card-topic" class="text-xs font-bold text-indigo-600 uppercase tracking-wider">Topic</span>
                <span id="progress-badge" class="bg-indigo-100 text-indigo-700 text-xs px-3 py-1 rounded-full font-semibold">Question 1 of 30</span>
            </div>

            <div class="bg-white rounded-2xl shadow-xl p-6 sm:p-8 border border-slate-100">
                <h2 id="card-question" class="text-lg sm:text-xl font-bold text-slate-900 mb-4">Question text</h2>

                <div class="mb-5">
                    <label for="user-answer" class="block text-sm font-medium text-slate-600 mb-1">Your Answer / Notes Space:</label>
                    <textarea id="user-answer" rows="3" placeholder="Type your structured answer or mental notes here before checking..." class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm"></textarea>
                </div>

                <button id="submit-btn" onclick="checkAnswer()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-xl transition shadow-lg shadow-indigo-100">
                    Check Model Answer & Reasoning
                </button>

                <div id="feedback-section" class="hidden mt-6 pt-6 border-t border-slate-100 space-y-4">
                    <div>
                        <h3 class="text-xs font-bold text-emerald-600 uppercase tracking-wider mb-1">Model Answer:</h3>
                        <p id="model-answer-text" class="text-slate-700 bg-emerald-50 border border-emerald-100 p-3.5 rounded-xl text-sm font-medium"></p>
                    </div>
                    <div>
                        <h3 class="text-xs font-bold text-indigo-600 uppercase tracking-wider mb-1">Examiner Reasoning & Breakdown:</h3>
                        <p id="reasoning-text" class="text-slate-600 bg-indigo-50 border border-indigo-100 p-3.5 rounded-xl text-sm leading-relaxed"></p>
                    </div>
                    <button onclick="nextQuestion()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3 px-6 rounded-xl transition">
                        Next Question &rarr;
                    </button>
                </div>
            </div>
        </div>

    </main>

                    modelAnswer: "Strategic decisions are long-term, high-risk, organization-wide choices made by senior management. Tactical decisions are short-term, medium-risk, day-to-day choices made by middle managers to execute the broader strategy.",
                    reasoning: "Contrasting scope, timeframe, risk level, and management level."
                },
                {
                    difficulty: "Hard",
                    question: "Discuss whether corporate governance codes are effective in preventing corporate fraud and executive excess.",
                    modelAnswer: "Corporate governance codes enforce board transparency, independent non-executive directors, and audit accountability, deterring malpractice. However, compliance can sometimes become a superficial box-ticking exercise that fails to stop determined executive fraud.",
                    reasoning: "Balanced evaluation weighing transparency and accountability benefits against token compliance and enforcement limitations."
                },
                {
                    difficulty: "Easy",
                    question: "Define 'stakeholder conflict'.",
                    modelAnswer: "Stakeholder conflict occurs when the differing objectives and priorities of various stakeholder groups (e.g., shareholders wanting high dividends versus employees wanting higher wages) clash.",
                    reasoning: "Basic business stakeholder concept definition."
                },
                {
                    difficulty: "Medium",
                    question: "Explain how a business can use stakeholder mapping (The Mendelow Matrix) to manage competing interests.",
                    modelAnswer: "The Mendelow Matrix maps stakeholders based on their power and interest, guiding managers on whether to 'keep satisfied', 'manage closely', 'keep informed', or 'monitor' each group during strategic changes.",
                    reasoning: "Chain of analysis: Stakeholder power and interest evaluated -> targeted communication and engagement strategy applied -> minimization of stakeholder resistance."
                },
                {
                    difficulty: "Hard",
                    question: "Evaluate the long-term strategic viability of pursuing aggressive market penetration in a mature, saturated market.",
                    modelAnswer: "Market penetration can boost short-term sales volume and squeeze out weaker competitors through heavy promotion or price cutting. However, in a saturated market, this often triggers destructive price wars, depressing industry-wide profit margins without expanding total market size.",
                    reasoning: "Comprehensive evaluation balancing market share gains against destructive price-war risks and margin erosion in zero-growth sectors."
                }
            ]
        };

        let activeTopic = null;
        let currentIdx = 0;
        let currentQuestions = [];

        function renderDashboard() {
            document.getElementById("dashboard-view").classList.remove("hidden");
            document.getElementById("quiz-view").classList.add("hidden");
            document.getElementById("home-btn").classList.add("hidden");
            
            const topicsGrid = document.getElementById("topics-grid");
            topicsGrid.innerHTML = "";
            
            for (const topic in questionDatabase) {
                const count = questionDatabase[topic].length;
                const card = document.createElement("div");
                card.className = "bg-white p-6 rounded-2xl shadow-md border border-slate-100 hover:shadow-lg hover:border-indigo-200 transition cursor-pointer flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <h3 class="text-lg font-bold text-slate-900 mb-1">${topic}</h3>
                        <p class="text-xs text-slate-500">${count} revision flashcard questions available</p>
                    </div>
                    <div class="mt-4 flex items-center text-xs font-semibold text-indigo-600">
                        Start Topic &rarr;
                    </div>
                `;
                card.onclick = () => startQuiz(topic);
                topicsGrid.appendChild(card);
            }
        }

        function startQuiz(topic) {
            activeTopic = topic;
            currentQuestions = questionDatabase[topic];
            currentIdx = 0;
            
            document.getElementById("dashboard-view").classList.add("hidden");
            document.getElementById("quiz-view").classList.remove("hidden");
            document.getElementById("home-btn").classList.remove("hidden");
            
            loadCard();
        }

        function loadCard() {
            const current = currentQuestions[currentIdx];
            document.getElementById("card-topic").textContent = `${activeTopic} • ${current.difficulty} Level`;
            document.getElementById("card-question").textContent = current.question;
            document.getElementById("user-answer").value = "";
            document.getElementById("feedback-section").classList.add("hidden");
            document.getElementById("submit-btn").classList.remove("hidden");
            document.getElementById("progress-badge").textContent = `Question ${currentIdx + 1} of ${currentQuestions.length}`;
        }

        function checkAnswer() {
            const current = currentQuestions[currentIdx];
            document.getElementById("model-answer-text").textContent = current.modelAnswer;
            document.getElementById("reasoning-text").textContent = current.reasoning;
            
            document.getElementById("submit-btn").classList.add("hidden");
            document.getElementById("feedback-section").classList.remove("hidden");
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < currentQuestions.length) {
                loadCard();
            } else {
                alert("You have completed all questions in this topic!");
                returnToDashboard();
            }
        }

        function returnToDashboard() {
            renderDashboard();
        }

        window.onload = renderDashboard;
    </script>
</body>
</html>
