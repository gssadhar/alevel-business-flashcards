<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Level & GCSE Revision Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .topic-card:hover { transform: translateY(-2px); transition: all 0.2s; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <header class="bg-white border-b border-slate-200 p-6 sticky top-0 z-10">
        <h1 class="text-2xl font-bold text-slate-800">Revision Hub</h1>
    </header>

    <main class="max-w-4xl mx-auto p-6" id="app">
        <!-- Level Selection -->
        <section id="view-level" class="space-y-6">
            <h2 class="text-xl font-semibold">Select your level:</h2>
            <div class="grid md:grid-cols-2 gap-4">
                <div class="p-6 bg-white border border-slate-200 rounded-xl shadow-sm cursor-pointer topic-card" onclick="showView('view-gcse-subjects')">
                    <h3 class="font-bold text-lg">GCSE Revision</h3>
                    <p class="text-slate-500 text-sm mt-1">Mathematics & Sciences.</p>
                </div>
                <div class="p-6 bg-white border border-slate-200 rounded-xl shadow-sm cursor-pointer topic-card" onclick="showView('view-alevel-subjects')">
                    <h3 class="font-bold text-lg">A-Level Revision</h3>
                    <p class="text-slate-500 text-sm mt-1">Business & Economics.</p>
                </div>
            </div>
        </section>

        <!-- GCSE Subject Selection -->
        <section id="view-gcse-subjects" class="hidden space-y-6">
            <button onclick="showView('view-level')" class="text-blue-600 font-semibold text-sm">← Back</button>
            <h2 class="text-xl font-semibold">GCSE Subjects:</h2>
            <div class="grid md:grid-cols-2 gap-4">
                <div class="p-6 bg-white border border-slate-200 rounded-xl shadow-sm cursor-pointer topic-card" onclick="selectTopic('gcse-maths')">
                    <h3 class="font-bold text-lg">Mathematics</h3>
                </div>
            </div>
        </section>

        <!-- A-Level Subject Selection -->
        <section id="view-alevel-subjects" class="hidden space-y-6">
            <button onclick="showView('view-level')" class="text-blue-600 font-semibold text-sm">← Back</button>
            <h2 class="text-xl font-semibold">A-Level Subjects:</h2>
            <div class="grid md:grid-cols-2 gap-4">
                <div class="p-6 bg-white border border-slate-200 rounded-xl shadow-sm cursor-pointer topic-card" onclick="showView('view-alevel-themes')">
                    <h3 class="font-bold text-lg">Business Studies</h3>
                </div>
            </div>
        </section>

        <!-- A-Level Theme Selection -->
        <section id="view-alevel-themes" class="hidden space-y-6">
            <button onclick="showView('view-alevel-subjects')" class="text-blue-600 font-semibold text-sm">← Back</button>
            <h2 class="text-xl font-semibold">Select Business Theme:</h2>
            <div class="grid md:grid-cols-2 gap-4">
                <!-- Theme cards trigger loadQuestion('Theme X') -->
                <div class="p-4 bg-white border rounded-lg cursor-pointer" onclick="loadQuestion('Theme 1')">Theme 1: Marketing & People</div>
                <div class="p-4 bg-white border rounded-lg cursor-pointer" onclick="loadQuestion('Theme 2')">Theme 2: Managing Business</div>
            </div>
        </section>

        <!-- Question View -->
        <section id="view-question" class="hidden bg-white p-8 rounded-2xl shadow-sm border">
            <div id="quiz-content" class="space-y-4">
                <div id="meta" class="text-xs font-bold text-blue-600 uppercase"></div>
                <div id="extract" class="p-4 bg-slate-50 border-l-4 border-blue-500 text-sm text-slate-600"></div>
                <h3 id="question-text" class="text-lg font-medium"></h3>
                <textarea id="answer-input" class="w-full border rounded-lg p-3" rows="4" placeholder="Enter your answer..."></textarea>
                <button onclick="checkAnswer()" class="w-full bg-slate-900 text-white py-3 rounded-lg font-bold">Submit</button>
            </div>
        </section>
    </main>

    <script>
        const db = {
            "Theme 1": [
                { meta: "Theme 1 • Q1", extract: "Market research data...", question: "Calculate YED...", model: "Formula: % change Q / % change Y..." }
            ]
        };

        function showView(id) {
            document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function loadQuestion(theme) {
            const q = db[theme][0];
            document.getElementById('meta').innerText = q.meta;
            document.getElementById('extract').innerText = q.extract;
            document.getElementById('question-text').innerText = q.question;
            showView('view-question');
        }

        function checkAnswer() {
            alert("Answer submitted! Check console for simulated feedback.");
        }
    </script>
</body>
</html>
