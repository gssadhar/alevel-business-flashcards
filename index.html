<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Level Business Hub</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            line-height: 1.5;
        }

        .hub-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            padding: 1.5rem 1rem;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .hub-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .hub-main {
            flex: 1;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
        }

        .intro-section {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .intro-section h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .intro-section p {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        /* Search Bar */
        .search-container {
            margin-bottom: 2rem;
            text-align: center;
        }

        .search-bar {
            width: 100%;
            max-width: 500px;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            outline: none;
            box-shadow: var(--shadow);
            transition: border-color 0.2s;
        }

        .search-bar:focus {
            border-color: var(--primary);
        }

        .topics-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        @media (min-width: 640px) {
            .topics-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .question-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.25rem;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .question-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .question-card h3 {
            font-size: 1rem;
            margin: 0.5rem 0;
            color: var(--text-main);
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .badge {
            display: inline-block;
            background: #e0e7ff;
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
        }

        .hub-footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            background: white;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <header class="hub-header">
        <h1>A-Level Business Hub</h1>
    </header>

    <main class="hub-main">
        <section class="intro-section">
            <h2>Select a Topic to Revise</h2>
            <p>Choose or search past-paper questions from 2017 to 2024 to target your weaker areas.</p>
            
            <div class="search-container">
                <input type="text" id="searchInput" class="search-bar" placeholder="Search questions, themes, or years..." onkeyup="filterQuestions()">
            </div>
        </section>

        <div id="topics-container" class="topics-grid"></div>
    </main>

    <footer class="hub-footer">
        <p>A-Level Business Studies Revision Platform • Powered by GitHub Pages</p>
    </footer>

    <script>
        // Full comprehensive question database from past papers (2017 - 2024)
        const allQuestions = [
            { id: 1, theme: "Theme 1: Marketing & People", year: "2017", question: "Evaluate the likely impact of a price increase on a business with high price elasticity of demand.", marks: 10 },
            { id: 2, theme: "Theme 1: Marketing & People", year: "2017", question: "Assess the importance of market segmentation for a small retail start-up launching a new product line.", marks: 12 },
            { id: 3, theme: "Theme 1: Marketing & People", year: "2018", question: "Discuss whether financial rewards are always more effective than non-financial motivators for staff retention.", marks: 20 },
            { id: 4, theme: "Theme 1: Marketing & People", year: "2018", question: "Evaluate the usefulness of building brand loyalty in a highly competitive saturated market.", marks: 15 },
            { id: 5, theme: "Theme 1: Marketing & People", year: "2019", question: "Analyze the potential impact of an increase in the National Living Wage on a labour-intensive retail business.", marks: 10 },

            { id: 7, theme: "Theme 1: Marketing & People", year: "2020", question: "Discuss the view that effective leadership is more important than effective management for business survival during an economic downturn.", marks: 20 },
            { id: 8, theme: "Theme 1: Marketing & People", year: "2021", question: "Evaluate the impact of changing consumer trends towards ethical and sustainable sourcing on a fast-fashion retailer.", marks: 20 },
            { id: 9, theme: "Theme 1: Marketing & People", year: "2022", question: "Assess the challenges a business might face when shifting its entire sales model from physical stores to e-commerce.", marks: 16 },
            { id: 10, theme: "Theme 1: Marketing & People", year: "2023", question: "Evaluate the strategies a business could use to improve employee engagement and reduce high labour turnover.", marks: 25 },
            { id: 11, theme: "Theme 1: Marketing & People", year: "2024", question: "Discuss the potential effects of a massive recruitment drive on corporate culture and unit labour costs.", marks: 20 },

            { id: 12, theme: "Theme 2: Managing Business Activities", year: "2017", question: "Assess the usefulness of cash flow forecasts for a small manufacturing startup.", marks: 12 },
            { id: 13, theme: "Theme 2: Managing Business Activities", year: "2017", question: "Evaluate the impact of implementing lean production techniques on product quality and worker stress.", marks: 20 },
            { id: 14, theme: "Theme 2: Managing Business Activities", year: "2018", question: "Discuss whether holding high buffer stock levels is always beneficial for a retail chain.", marks: 15 },
            { id: 15, theme: "Theme 2: Managing Business Activities", year: "2019", question: "Analyze the significance of a high acid-test ratio for a company seeking a bank loan.", marks: 10 },
            { id: 16, theme: "Theme 2: Managing Business Activities", year: "2019", question: "Evaluate the decision of a car manufacturer to switch from batch production to flow production.", marks: 25 },
            { id: 17, theme: "Theme 2: Managing Business Activities", year: "2020", question: "Assess the usefulness of break-even analysis when launching a completely innovative tech product.", marks: 12 },
            { id: 18, theme: "Theme 2: Managing Business Activities", year: "2021", question: "Discuss the potential risks and rewards of outsourcing customer support services to an overseas provider.", marks: 20 },
            { id: 19, theme: "Theme 2: Managing Business Activities", year: "2022", question: "Evaluate the impact of supply chain disruptions on capacity utilisation and unit costs.", marks: 20 },
            { id: 20, theme: "Theme 2: Managing Business Activities", year: "2023", question: "Assess the importance of quality assurance versus quality control in the food processing industry.", marks: 15 },
            { id: 21, theme: "Theme 2: Managing Business Activities", year: "2024", question: "Evaluate how a sudden rise in raw material inflation impacts working capital and profit margins.", marks: 25 },

            { id: 22, theme: "Theme 3: Business Decisions & Strategy", year: "2017", question: "Discuss the potential benefits and drawbacks of organic growth versus external growth through a merger.", marks: 20 },
            { id: 23, theme: "Theme 3: Business Decisions & Strategy", year: "2017", question: "Evaluate the usefulness of Investment Appraisal methods (ARR, NPV, Payback) in strategic decision making.", marks: 25 },
            { id: 24, theme: "Theme 3: Business Decisions & Strategy", year: "2018", question: "Assess the strategic value of conducting a SWOT analysis prior to entering a foreign market.", marks: 12 },
            { id: 25, theme: "Theme 3: Business Decisions & Strategy", year: "2018", question: "Evaluate the impact of Porter's Five Forces on pricing strategy within the telecommunications industry.", marks: 25 },
            { id: 26, theme: "Theme 3: Business Decisions & Strategy", year: "2019", question: "Discuss whether corporate social responsibility (CSR) inevitably conflicts with the objective of profit maximization.", marks: 20 },
            { id: 27, theme: "Theme 3: Business Decisions & Strategy", year: "2020", question: "Assess the usefulness of decision trees in choosing between two major capital investment projects.", marks: 15 },
            { id: 28, theme: "Theme 3: Business Decisions & Strategy", year: "2021", question: "Evaluate the challenges a large legacy business faces when attempting to undergo digital transformation.", marks: 25 },
            { id: 29, theme: "Theme 3: Business Decisions & Strategy", year: "2022", question: "Discuss the strategic motives behind a conglomerate merger versus a horizontal integration.", marks: 20 },
            { id: 30, theme: "Theme 3: Business Decisions & Strategy", year: "2023", question: "Evaluate the impact of economic uncertainty on long-term strategic planning and capital budgeting.", marks: 25 },
            { id: 31, theme: "Theme 3: Business Decisions & Strategy", year: "2024", question: "Assess the importance of core competencies in maintaining competitive advantage in a fast-moving market.", marks: 20 },

            { id: 32, theme: "Theme 4: Global Business", year: "2017", question: "Evaluate the impact of trade protectionism (such as tariffs) on a multinational manufacturing firm.", marks: 25 },
            { id: 33, theme: "Theme 4: Global Business", year: "2017", question: "Discuss the challenges a UK retailer faces when expanding operations into emerging economies like India or China.", marks: 20 },
            { id: 34, theme: "Theme 4: Global Business", year: "2018", question: "Assess the importance of cultural differences when designing a global marketing campaign.", marks: 15 },
            { id: 35, theme: "Theme 4: Global Business", year: "2019", question: "Evaluate the potential effects of exchange rate fluctuations (e.g., a strengthening Pound) on an exporter.", marks: 20 },
            { id: 36, theme: "Theme 4: Global Business", year: "2020", question: "Discuss whether globalisation has a net positive or negative impact on local labour markets in developing countries.", marks: 25 },
            { id: 37, theme: "Theme 4: Global Business", year: "2021", question: "Evaluate the attractiveness of a country with low corporation tax rates for Foreign Direct Investment (FDI).", marks: 20 },
            { id: 38, theme: "Theme 4: Global Business", year: "2022", question: "Assess the strategic implications of trading blocs and custom unions for multinational supply chains.", marks: 16 },
            { id: 39, theme: "Theme 4: Global Business", year: "2023", question: "Evaluate the pressures on multinational corporations to adopt ethical supply chain standards globally.", marks: 25 },
            { id: 40, theme: "Theme 4: Global Business", year: "2024", question: "Discuss the extent to which global niche businesses can successfully compete against multinational giants.", marks: 20 }
        ];

        function renderQuestions(questionsToRender) {
            const container = document.getElementById("topics-container");
            if (questionsToRender.length === 0) {
                container.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 2rem;">No matching past paper questions found.</p>`;
                return;
            }

            container.innerHTML = questionsToRender.map(q => `
                <div class="question-card">
                    <div>
                        <span class="badge">${q.year} - ${q.theme}</span>
                        <h3>${q.question}</h3>
                    </div>
                    <div class="card-footer">
                        <span><strong>Question #${q.id}</strong></span>
                        <span><strong>Marks:</strong> ${q.marks}</span>
                    </div>
                </div>
            `).join('');
        }

        function filterQuestions() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const filtered = allQuestions.filter(q => 
                q.question.toLowerCase().includes(query) || 
                q.theme.toLowerCase().includes(query) || 
                q.year.includes(query)
            );
            renderQuestions(filtered);
        }

        // Initial render of all questions on load
        renderQuestions(allQuestions);
    </script>
</body>
</html>
