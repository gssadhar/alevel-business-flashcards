<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Level Business Hub</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            line-height: 1.5;
        }

        .hub-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            padding: 1.5rem 1rem;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .hub-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .hub-main {
            flex: 1;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
        }

        .intro-section {
            text-align: center;
            margin-bottom: 2rem;
        }

        .intro-section h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .intro-section p {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .topics-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        @media (min-width: 640px) {
            .topics-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .question-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.25rem;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .question-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .question-card h3 {
            font-size: 1rem;
            margin: 0.5rem 0;
            color: var(--text-main);
        }

        .badge {
            display: inline-block;
            background: #e0e7ff;
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
        }

        .hub-footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            background: white;
        }
    </style>
</head>
<body>
    <header class="hub-header">
        <h1>A-Level Business Hub</h1>
    </header>

    <main class="hub-main">
        <section class="intro-section">
            <h2>Select a Topic to Revise</h2>
            <p>Choose a section below to target your weaker areas with past-paper questions from 2017 to 2024.</p>
        </section>

        <div id="topics-container" class="topics-grid"></div>
    </main>

    <footer class="hub-footer">
        <p>A-Level Business Studies Revision Platform • Powered by GitHub Pages</p>
    </footer>

    <script>
        const allQuestions = [
            {
                theme: "Theme 1: Marketing & People",
                year: "2017",
                question: "Evaluate the likely impact of a price increase on a business with high price elasticity of demand.",
                marks: 10
            },
            {
                theme: "Theme 2: Managing Business Activities",
                year: "2018",
                question: "Assess the usefulness of cash flow forecasts for a small retail startup.",
                marks: 12
            },
            {
                theme: "Theme 3: Business Decisions & Strategy",
                year: "2022",
                question: "Discuss the potential benefits and drawbacks of organic growth versus external growth through a merger.",
                marks: 20
            },
            {
                theme: "Theme 4: Global Business",
                year: "2024",
                question: "Evaluate the impact of trade protectionism (such as tariffs) on a multinational manufacturing firm.",
                marks: 25
            }
        ];

        const container = document.getElementById("topics-container");
        container.innerHTML = allQuestions.map((q, index) => `
            <div class="question-card">
                <span class="badge">${q.year} - ${q.theme}</span>
                <h3>Q${index + 1}: ${q.question}</h3>
                <p><strong>Marks:</strong> ${q.marks}</p>
            </div>
        `).join('');
    </script>
</body>
</html>
