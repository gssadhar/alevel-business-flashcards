<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Level & GCSE Revision Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 p-4">
    <main id="app" class="max-w-4xl mx-auto bg-white p-8 rounded-2xl shadow-sm border">
        <h1 class="text-3xl font-bold mb-8 text-center">Revision Hub</h1>
        
        <div id="menu-view" class="grid md:grid-cols-2 gap-6">
            <button onclick="showSection('gcse-menu')" class="p-6 border rounded-xl hover:border-blue-500">GCSE Maths</button>
            <button onclick="showSection('alevel-menu')" class="p-6 border rounded-xl hover:border-blue-500">A-Level Business</button>
        </div>

        <div id="gcse-menu" class="hidden">
            <button onclick="showSection('menu-view')" class="text-blue-600 mb-4">← Back</button>
            <div class="grid gap-4" id="gcse-topics"></div>
        </div>

        <div id="alevel-menu" class="hidden">
            <button onclick="showSection('menu-view')" class="text-blue-600 mb-4">← Back</button>
            <p>A-Level topics (Manage these in your /data folder)</p>
        </div>

        <div id="quiz-container" class="hidden">
            <button onclick="showSection('menu-view')" class="text-blue-600 mb-4">← Home</button>
            <h3 id="question-text" class="text-xl font-semibold mb-4"></h3>
            <textarea id="answer" class="w-full border p-3 rounded-lg mb-4"></textarea>
            <button onclick="submitAnswer()" class="bg-blue-600 text-white px-6 py-2 rounded-lg">Check Answer</button>
            <div id="feedback" class="hidden mt-6 p-4 bg-slate-100 rounded-lg">
                <p class="font-bold">Model Answer:</p>
                <p id="model-answer"></p>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
